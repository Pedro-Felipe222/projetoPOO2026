<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="script.js">
      defer
    </script>
    <script src="Aluno.js">
      defer
    </script>
    <title>Sistema Escolar</title>
  </head>
  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button
        class="tab-button active"
        id="btn-cadastrar"
        onclick="cadastrar()"
      >
        Cadastrar
      </button>

      <button class="tab-button" id="btn-listar" onclick="listar()">
        Listar Alunos
      </button>
    </div>

    <!-- Aba de cadastro -->
    <div id="tab-cadastrar" class="tab-content active">
      <label for="nome">Nome:</label>
      <input id="nome" type="text" placeholder="Nome do aluno" />

      <label for="matricula">Matrícula:</label>
      <input id="matricula" type="text" placeholder="Ex: 202612345" />

      <label for="frequencia">Frequencia (aulas frequentadas):</label>
      <input id="frequencia" type="number" min="0" max="20" step="1"/>

      <label for="n1">Nota 1:</label>
      <input id="n1" type="number" min="0" max="10" step="0.1" />

      <label for="n2">Nota 2:</label>
      <input id="n2" type="number" min="0" max="10" step="0.1" />

      <label for="n3">Nota 3:</label>
      <input id="n3" type="number" min="0" max="10" step="0.1" />

      <button onclick="salvar()" class="btn-salvar">Salvar Aluno</button>
    </div>

    <!-- Aba de listagem -->
    <div id="tab-listar" class="tab-content">
      <h3>Alunos Cadastrados</h3>

      <ul id="alunos" class="lista-alunos">
        <li>Nenhum aluno cadastrado ainda.</li>
      </ul>
    </div>

    <script src="./script.js"></script>

    
    <!-- Modal de detalhes do aluno -->
    <div id="modal-detalhes" class="modal">
      <div class="modal-conteudo">
        <button class="modal-fechar" onclick="fecharDetalhes()">
          &times;
        </button>

        <h2 id="modal-nome">Detalhes do aluno</h2>

        <p id="modal-nota1"></p>
        <p id="modal-nota2"></p>
        <p id="modal-nota3"></p>
        <p id="modal-frequencia"></p>
        <p id="modal-ranking"></p>

        <button class="btn-fechar" onclick="fecharDetalhes()">
          Fechar
        </button>
      </div>
    </div>

  </body>
</html>
